name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/folio
          cp src-tauri/target/release/folio dist/folio/
          cp src-tauri/pdfium/libpdfium.so dist/folio/
          cd dist
          tar -czf folio-linux-x86_64.tar.gz folio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-linux-x86_64
          path: dist/folio-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      # pdfium is embedded into the executable at build time (see build.rs), so
      # fetch the prebuilt Windows DLL *before* building and place it where the
      # build script looks. The resulting folio.exe is fully self-contained.
      - name: Fetch pdfium.dll
        shell: pwsh
        run: |
          $url = "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz"
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force -Path src-tauri/pdfium | Out-Null
          tar -xzf pdfium.tgz -C src-tauri/pdfium --strip-components=1 bin/pdfium.dll
          if (-not (Test-Path src-tauri/pdfium/pdfium.dll)) { throw "pdfium.dll was not extracted from the archive" }

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      # A single self-contained executable — no DLL shipped alongside it.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-x86_64
          path: src-tauri/target/release/folio.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download every uploaded artifact; each lands in its own subfolder.
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/folio-linux-x86_64.tar.gz
            dist/**/folio.exe
          generate_release_notes: true
          draft: false
