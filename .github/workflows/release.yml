name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist/folio
          cp src-tauri/target/release/folio dist/folio/
          cp src-tauri/pdfium/libpdfium.so dist/folio/
          cd dist
          tar -czf folio-linux-x86_64.tar.gz folio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-linux-x86_64
          path: dist/folio-linux-x86_64.tar.gz

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: folio-linux-x86_64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/folio-linux-x86_64.tar.gz
          generate_release_notes: true
          draft: false