[package]
name = "folio"
version = "0.9.0"
edition = "2021"
description = "Folio — a fast, native PDF reader and organiser (pure Rust, egui)"
default-run = "folio"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
# ── Native GUI: egui / eframe (GPU-accelerated, no webview) ──────────────────
eframe = { version = "=0.31", default-features = false, features = [
    "glow",          # OpenGL backend — widest Linux compatibility
    "default_fonts", # bundled UI fonts (no system/web font dependency)
    "wayland",
    "x11",
] }
egui = "=0.31"

# ── PDF engine: pdfium-render ────────────────────────────────────────────────
pdfium-render = { version = "0.8", features = ["image"] }

# ── Native file dialog ───────────────────────────────────────────────────────
rfd = "0.15"

# ── Image handling ───────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# ── Serialisation / util ─────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
dirs        = "5"
uuid        = { version = "1", features = ["v4"] }

# ── Google Drive integration (optional, `drive` feature) ─────────────────────
ureq      = { version = "2", optional = true }
sha2      = { version = "0.10", optional = true }
base64    = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }

# ── Linux trackpad pinch-to-zoom (libinput) ──────────────────────────────────
# winit does not deliver touchpad pinch gestures on X11/Wayland, so we read them
# straight from libinput in a background thread. Capped at the 1.19 API so it
# links against the widely-shipped libinput 1.20 runtime (1.21+ symbols absent).
[target.'cfg(target_os = "linux")'.dependencies]
input = { version = "0.10", default-features = false, features = ["udev", "libinput_1_19"] }
libc  = "0.2"

[features]
# Networked Google Drive support. Off by default so the standard build stays
# fully offline with no TLS/HTTP dependencies.
drive = ["dep:ureq", "dep:sha2", "dep:base64", "dep:getrandom"]

[profile.release]
opt-level     = 3
codegen-units = 1
lto           = true
strip         = true

[build-dependencies]
# Embeds the application icon into folio.exe on Windows (no-op elsewhere).
winresource = "0.1"

[profile.dev]
opt-level = 1          # keep the UI responsive even in debug
